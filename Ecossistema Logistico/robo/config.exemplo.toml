# Copie para config.toml e preencha. Senhas NÃO ficam aqui: use  python robo.py --senha promax  (e --senha banco).

pasta = 'C:\Sistema Revenda\ROBO'      # onde os arquivos baixados ficam guardados (uma pasta por dia)
revenda = "Lima Rio Verde"              # revenda padrão (nome igual ao do sistema)
espera_seg = 180                        # tempo máximo de espera de cada passo no site
tentativas = 2                          # tenta de novo se o site falhar

navegador = "msedge"                    # msedge = Edge do Windows · chrome · chromium (o do robô)

# Sem acesso direto ao banco (sistema na nuvem com SQLite): o robô manda o arquivo para o repositório PRIVADO do
# backup e o sistema importa sozinho. Guarde o token (o mesmo BACKUP_GITHUB_TOKEN dos Secrets) com:
#   robo.bat --senha github
repo_nuvem = "lazaro0067/eco-backup"

[promax]
url = "https://ENDERECO-DO-PROMAX"
usuario = "SEU_USUARIO"

[powerbi]
url = "https://app.powerbi.com/groups/me/reports/..."   # o link do relatório

[cora]
url = "https://ENDERECO-DO-CORA"         # site da Grade Cora
usuario = "SEU_USUARIO"

[wms]
url = "https://ENDERECO-DO-WMS"
usuario = "SEU_USUARIO"

# Um bloco por relatório. nome = a receita (robo/receitas/<nome>.py); importar = como entra no sistema:
#   vendas | compra | pcd | saldo_estoque | contagem_validade | estoque | pedidos_marcados | ressuprimento |
#   linear | produtos | politica | so_baixar
# dias: seg-sab, todos, seg,qua,sex …   revenda: opcional (outra revenda para este relatório)
# receita: opcional (outra receita; ex.: a MESMA receita para várias revendas)   operacao_site: como a operação
# aparece no site (a receita usa ctx.operacao)   grupo: agendamento próprio (ex.: "grade" = agendar_grade.bat)

[[relatorios]]
nome = "ressuprimento"
site = "powerbi"
importar = "ressuprimento"
dias = "todos"
mostrar = false                         # true = abre o navegador na tela enquanto baixa

[[relatorios]]
nome = "vendas"
site = "promax"
importar = "vendas"
dias = "seg-sab"

[[relatorios]]
nome = "compra"
site = "promax"
importar = "compra"
dias = "seg-sab"

[[relatorios]]
nome = "saldo_estoque"
site = "promax"
importar = "saldo_estoque"
dias = "todos"

[[relatorios]]
nome = "posicao_estoque"
site = "promax"
importar = "estoque"
dias = "seg-sab"

[[relatorios]]
nome = "contagem"
site = "wms"
importar = "contagem_validade"
dias = "seg"

# --- Grade Cora: a mesma receita (grade_cora) para cada revenda, a cada 2 h (agendar_grade.bat) ---------------
[[relatorios]]
nome = "grade_rio_verde"
receita = "grade_cora"
site = "cora"
importar = "estoque"
revenda = "Lima Rio Verde"
operacao_site = "RIO VERDE"             # como aparece para escolher no Cora
grupo = "grade"
dias = "todos"

[[relatorios]]
nome = "grade_barreiras"
receita = "grade_cora"
site = "cora"
importar = "estoque"
revenda = "Lima Barreiras"
operacao_site = "BARREIRAS"
grupo = "grade"
dias = "todos"

[[relatorios]]
nome = "grade_sao_felix"
receita = "grade_cora"
site = "cora"
importar = "estoque"
revenda = "Lima São Félix"
operacao_site = "SÃO FÉLIX"
grupo = "grade"
dias = "todos"
