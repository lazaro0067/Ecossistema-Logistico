<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; color: #52514e; }
  .box { display: flex; align-items: center; justify-content: space-between; gap: 8px;
         padding: 8px 12px; border-radius: 10px; background: #f0efec; border: 1px solid #e1e0d9; }
  .box.ok { background: #e8f6e8; border-color: #bfe5bf; color: #0b5d0b; }
  .box.erro { background: #fdf0e0; border-color: #f6d7a8; color: #8a5300; }
  button { border: 1px solid #c3c2b7; background: #fff; border-radius: 8px; padding: 5px 10px;
           font-size: 13px; cursor: pointer; color: #0b0b0b; white-space: nowrap; }
</style>
</head>
<body>
<div class="box" id="box"><span id="txt">📍 Obtendo sua localização…</span><button id="bt">Atualizar</button></div>
<script>
  function enviar(tipo, dados) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: tipo }, dados || {}), "*");
  }
  function altura() { enviar("streamlit:setFrameHeight", { height: document.body.scrollHeight + 2 }); }
  function valor(v) { enviar("streamlit:setComponentValue", { value: v, dataType: "json" }); }

  var enviado = null, enviouErro = false;
  function dist(a, b) {
    var R = 6371000, r = Math.PI / 180;
    var dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function mostrar(cls, txt) {
    document.getElementById("box").className = "box " + cls;
    document.getElementById("txt").textContent = txt;
    altura();
  }
  function ok(p, forcar) {
    var v = { lat: p.coords.latitude, lon: p.coords.longitude,
              precisao: Math.round(p.coords.accuracy || 0), ts: Date.now() };
    mostrar("ok", "📍 Localização ativa (±" + v.precisao + " m)");
    // só avisa o sistema na 1ª leitura, ao andar mais de 75 m, a cada 3 min ou no botão
    if (forcar || !enviado || dist(enviado, v) > 75 || (v.ts - enviado.ts) > 180000) {
      enviado = v; enviouErro = false; valor(v);
    }
  }
  function falha(e) {
    var msg = (e && e.code === 1) ? "Permita a localização no navegador para registrar o GPS."
                                  : "Não foi possível obter a localização.";
    mostrar("erro", "⚠️ " + msg);
    if (!enviouErro && !enviado) { enviouErro = true; valor({ erro: msg }); }
  }
  var opcoes = { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 };
  function iniciar() {
    if (!navigator.geolocation) { falha(null); return; }
    navigator.geolocation.getCurrentPosition(function (p) { ok(p, false); }, falha, opcoes);
    try { navigator.geolocation.watchPosition(function (p) { ok(p, false); }, function () {}, opcoes); } catch (e) {}
  }
  document.getElementById("bt").addEventListener("click", function () {
    mostrar("", "📍 Atualizando…");
    if (navigator.geolocation)
      navigator.geolocation.getCurrentPosition(function (p) { ok(p, true); }, falha,
        { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  });
  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.type === "streamlit:render") altura();
  });
  enviar("streamlit:componentReady", { apiVersion: 1 });
  altura();
  iniciar();
</script>
</body>
</html>
